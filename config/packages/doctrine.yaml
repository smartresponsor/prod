doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

    orm:
        enable_native_lazy_objects: true
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                auto_mapping: false
                mappings:
                    App:
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App
                    Accessing:
                        is_bundle: false
                        dir: '%kernel.project_dir%/../Accessing/src/Entity'
                        prefix: 'App\Accessing\Entity'
                        alias: Accessing
                    Objecting:
                        is_bundle: false
                        dir: '%kernel.project_dir%/vendor/objecting/object/src'
                        prefix: 'App\Objecting'
                        alias: Objecting
