doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            Accessing:
                is_bundle: false
                dir: '%kernel.project_dir%/../Accessing/src/Entity'
                prefix: 'App\Accessing\Entity'
                alias: Accessing
            Cruding:
                is_bundle: false
                dir: '%kernel.project_dir%/../Cruding/src/Entity'
                prefix: 'App\Cruding\Entity'
                alias: Cruding
            Objecting:
                is_bundle: false
                dir: '%kernel.project_dir%/vendor/objecting/object/src/Entity'
                prefix: 'App\Objecting\Entity'
                alias: Objecting