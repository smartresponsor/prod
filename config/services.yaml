services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Fixture/'
            - '../src/DataFixtures/'
            - '../src/Kernel.php'
            - '../src/Schedule.php'
            - '../src/Service/Interfacing/Commerce/'
            - '../src/Service/Interfacing/Ecommerce/'
            - '../src/Service/Interfacing/Shell/ShellLayoutPreviewProviderService.php'
            - '../src/Service/Interfacing/Shell/ShellScreenCatalogProviderService.php'

    App\Contract\Ui\AppDashboardSurfaceContract:
        alias: App\Service\Dashboard\AppDashboardSurfaceBuilderService

    App\Service\Dashboard\AppDashboardSurfaceBuilderService:
        public: true
        tags:
            - controller.service_arguments

    App\Interfacing\ServiceInterface\Shell\ShellChromeProviderInterface:
        alias: App\Service\Interfacing\Shell\ShellChromeProviderService

    App\Twig\LocaleSelectorTwigExtension:
        tags: ['twig.extension']

imports:
    - { resource: '../vendor/accessing/access/config/services.yaml' }
